name: release

on:
  release:
    types: [published]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: windows-latest
    name: ${{ matrix.target }}
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        target: [ x64, x86 ]
    steps:
    - name: checkout
      uses: actions/checkout@v7
      with:
        submodules: recursive
        fetch-tags: true
        fetch-depth: 0
    - name: install bison/flex
      run: |
        choco install winflexbison3
    - name: alias bison/flex
      run: |
        $dir = (Get-Command win_bison).Source | Split-Path
        Copy-Item "$dir\win_bison.exe" "$dir\bison.exe"
        Copy-Item "$dir\win_flex.exe" "$dir\flex.exe"
    - name: prefetch zlib/libpng sources
      run: |
        New-Item -ItemType Directory -Force deps | Out-Null
        curl.exe -L -o deps\zlib.tar.xz   https://github.com/madler/zlib/releases/download/v1.3.2/zlib-1.3.2.tar.xz
        curl.exe -L -o deps\libpng.tar.xz https://download.sourceforge.net/libpng/libpng-1.6.58.tar.xz
        tar -xf deps\zlib.tar.xz   -C deps
        tar -xf deps\libpng.tar.xz -C deps
    - name: 'build'
      run: |
        cmake --preset msvc-static-${{ matrix.target }} `
          -DFETCHCONTENT_SOURCE_DIR_ZLIB=${{ github.workspace }}\deps\zlib-1.3.2 `
          -DFETCHCONTENT_SOURCE_DIR_PNG=${{ github.workspace }}\deps\libpng-1.6.58
        cmake --build --preset msvc-static-${{ matrix.target }}-relmin
    - name: 'release'
      run: |
        Compress-Archive -Path build\${{ matrix.target }}\bin\*.exe -Destination rgbdsxp-${{ matrix.target }}.zip
        gh release upload ${{github.event.release.tag_name}} rgbdsxp-${{ matrix.target }}.zip
      env:
        GITHUB_TOKEN: ${{ github.TOKEN }}